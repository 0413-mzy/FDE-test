name: Product checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s ../scripts/tests
      - run: ruff check ../scripts
      - run: ruff format --check ../scripts
      # Real HTTP tests require the independent Sandbox; never substitute mocks.
      - run: pytest -m "not integration and not database"
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: order_support_test
          POSTGRES_DB: order_support_test
          # Isolated disposable runner service; no password is stored in source.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U order_support_test -d order_support_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://order_support_test@127.0.0.1:5432/order_support_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # The independent Sandbox is opt-in and validated separately through real HTTP.
      - run: pytest tests/database -m "not integration" -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet

  public-demo-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce_container_test
          POSTGRES_DB: commerce_container_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_container_test -d commerce_container_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: production
      COMMERCE_PUBLIC_DEMO: "true"
      COMMERCE_PUBLIC_DEMO_BOOTSTRAP: "true"
      COMMERCE_PUBLIC_DEMO_LOCAL_ACCEPTANCE: "true"
      COMMERCE_PUBLIC_ORIGIN: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://commerce_container_test@127.0.0.1:5432/commerce_container_test
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate disposable demo credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key in ['COMMERCE_DEMO_PASSWORD', 'COMMERCE_OPERATOR_PASSWORD']:
                  value = secrets.token_urlsafe(32)
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - run: docker build -f deployment/Dockerfile -t commerce-public-demo .
      - name: Start actual production container
        run: >-
          docker run -d --name commerce-public-demo --network host
          -e APP_ENV -e COMMERCE_PUBLIC_DEMO -e COMMERCE_PUBLIC_DEMO_BOOTSTRAP
          -e COMMERCE_PUBLIC_DEMO_LOCAL_ACCEPTANCE -e COMMERCE_PUBLIC_ORIGIN
          -e DATABASE_URL -e COMMERCE_DEMO_PASSWORD -e COMMERCE_OPERATOR_PASSWORD
          -e PORT commerce-public-demo
      - name: Wait for database readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs commerce-public-demo
          exit 1
      - name: Verify real purchase, images and authorization
        run: python scripts/commerce-public-demo-acceptance.py --base-url http://127.0.0.1:8000 --receipt-file /tmp/commerce-public-receipt.json
      - run: docker restart commerce-public-demo
      - name: Verify restart keeps business records
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          python scripts/commerce-public-demo-acceptance.py --receipt-file /tmp/commerce-public-receipt.json --check-persisted
